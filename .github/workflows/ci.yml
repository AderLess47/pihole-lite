name: CI

on:
  push:
    branches:
      - main
      - "freebuff/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # Zielhost ist ein Raspberry Pi 1 (ARM1176, ARMv6, hard-float). Ein x86-Build
  # prueft weder Feature-Set noch Linker, deshalb hier ein echter Cross-Build
  # gegen arm-unknown-linux-gnueabihf mit dem Release-Profil.
  armv6:
    name: ARMv6 cross build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bullseye statt ubuntu-latest: dort ist die glibc 2.31, und gegen genau die wird
    # gelinkt. Auf ubuntu-latest (glibc 2.39) entsteht ein Binary, das auf einem
    # Raspberry Pi OS Bullseye/Bookworm mit "GLIBC_2.39 not found" nicht startet.
    # glibc ist abwaertskompatibel, 2.31 laeuft auf allen neueren Zielsystemen.
    container: debian:bullseye
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Werkzeuge
        run: |
          # Bullseye ist auf deb.debian.org nicht mehr vollstaendig (die Security-Suite
          # liefert 404 fuer die Pakete des Images), im Archiv liegt das ganze Release.
          printf 'deb http://archive.debian.org/debian bullseye main\n' > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list
          printf 'Acquire::Check-Valid-Until "false";\nAcquire::Retries "3";\n' \
            > /etc/apt/apt.conf.d/99archive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential file \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rust-Toolchain
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable \
            --component clippy --target arm-unknown-linux-gnueabihf

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: armv6-bullseye

      # Zielabhaengige Warnungen (z. B. bedingte Kompilierung, Layout-Annahmen
      # auf 32 Bit) tauchen im x86-Lauf nicht auf.
      - name: Clippy ARMv6
        run: cargo clippy --all-targets --target arm-unknown-linux-gnueabihf -- -D warnings

      - name: Release-Build
        run: cargo build --release --target arm-unknown-linux-gnueabihf

      # Das Binary wird auf fremden Systemen gestartet, deshalb hier hart pruefen:
      # kein GLIBC-Symbol darf neuer als die Baseline 2.31 sein.
      - name: Artefakt pruefen
        run: |
          file target/arm-unknown-linux-gnueabihf/release/pihole-lite
          needed=$(strings -a target/arm-unknown-linux-gnueabihf/release/pihole-lite \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "hoechste benoetigte glibc: $needed"
          if [ "$(printf '%s\n' 2.31 "$needed" | sort -V | tail -1)" != "2.31" ]; then
            echo "::error::Binary verlangt glibc $needed (> 2.31) und startet auf Raspberry Pi OS nicht"
            exit 1
          fi

      # Flach paketieren, damit der Download ohne Zielbaum ankommt.
      - name: Paketieren
        run: |
          cp target/arm-unknown-linux-gnueabihf/release/pihole-lite pihole-lite-armv6
          sha256sum pihole-lite-armv6 > pihole-lite-armv6.sha256

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pihole-lite-armv6
          path: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          if-no-files-found: error
          retention-days: 30

  # Ein Tag haengt das fertige Pi-Binary dauerhaft an das Release, statt es
  # nach 30 Tagen mit dem Workflow-Artefakt verfallen zu lassen.
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: armv6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: pihole-lite-armv6

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
