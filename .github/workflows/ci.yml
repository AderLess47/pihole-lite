name: CI

on:
  push:
    branches:
      - main
      - "freebuff/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # bench/ liegt ausserhalb des Crate-Baums: `cargo fmt`, `clippy` und `test`
  # sehen den Lastgenerator und die Messskripte nicht. Ohne diesen Job faellt ein
  # kaputtes bench/ erst auf dem Pi auf, wenn gemessen werden soll.
  bench:
    name: bench (loadgen, skripte)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Lastgenerator bauen
        run: rustc -O --edition 2021 -D warnings bench/loadgen.rs -o loadgen

      # Der Lastgenerator wird von messung.sh aufgerufen; bricht seine
      # Argument- oder Ausgabeschnittstelle, scheitert die Messung erst dort.
      - name: Lastgenerator rauchen
        run: |
          ./loadgen --help
          if ./loadgen --mode quatsch; then
            echo "::error::loadgen akzeptiert einen unbekannten Modus"
            exit 1
          fi
          ./loadgen --server 127.0.0.1:9 --seconds 1 --threads 2 --mode blocked > loadgen.txt
          cat loadgen.txt
          grep -q '^mode=blocked$' loadgen.txt
          grep -q '^qps=' loadgen.txt
          grep -q '^max_ms=' loadgen.txt

      - name: Skripte syntaktisch pruefen
        run: |
          bash -n bench/messung.sh
          bash -n bench/eintragen.sh

      # Prueft den Weg von ergebnis.md in die Doku, ohne Server und ohne Last:
      # genau der Teil, der auf dem Pi still danebengehen wuerde.
      - name: Tabelleneintrag pruefen
        run: |
          printf '%s\n' \
            '# Messergebnis' \
            '' \
            '| Lauf | Domains | RSS idle (MiB) | Peak idle (MiB) | RSS Last (MiB) | Peak Last (MiB) | QPS |' \
            '|---|---|---|---|---|---|---|' \
            '| Weiterleitung (leere Liste) | 0 | 1.2 | 1.2 | 1.4 | 1.4 | 250.0 |' \
            '| 100k Domains (Sinkhole) | 100000 | 11.0 | 11.0 | 11.0 | 11.0 | 40000.0 |' \
            '' \
            'Tier pro Lauf:' \
            '' \
            '| Lauf | Tier | QPS |' \
            '|---|---|---|' \
            '| 100k Domains (Sinkhole) | Tier 1 (Nano) | 40000.0 |' \
            > /tmp/ergebnis.md
          bash bench/eintragen.sh /tmp/ergebnis.md
          grep -q '| 100k Domains (Sinkhole) | 100000 | 11.0 | 11.0 | 11.0 | 11.0 | 40000.0 |' \
            docs/messungen.md
          if grep -q '^| 100k Domains (Sinkhole) | Tier 1' docs/messungen.md; then
            echo "::error::die Tier-Tabelle ist in die Messwerte geraten"
            exit 1
          fi

  # Zielhost ist ein Raspberry Pi 1 (ARM1176, ARMv6, hard-float). Ein x86-Build
  # prueft weder Feature-Set noch Linker, deshalb hier ein echter Cross-Build
  # gegen arm-unknown-linux-gnueabihf mit dem Release-Profil.
  armv6:
    name: ARMv6 cross build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bookworm statt ubuntu-latest: dort ist die glibc 2.36, und gegen genau die wird
    # gelinkt. Auf ubuntu-latest (glibc 2.39) entsteht ein Binary, das auf einem
    # Raspberry Pi OS mit "GLIBC_2.39 not found" nicht startet. Bookworm ist das
    # Debian, auf dem auch das 32-Bit-Image fuer Pi 1/Zero basiert.
    container: debian:bookworm
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Werkzeuge
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential file \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rust-Toolchain
        run: |
          curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable \
            --component clippy --target arm-unknown-linux-gnueabihf

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: armv6-bookworm

      # Zielabhaengige Warnungen (z. B. bedingte Kompilierung, Layout-Annahmen
      # auf 32 Bit) tauchen im x86-Lauf nicht auf.
      - name: Clippy ARMv6
        run: cargo clippy --all-targets --target arm-unknown-linux-gnueabihf -- -D warnings

      - name: Release-Build
        run: cargo build --release --target arm-unknown-linux-gnueabihf

      # Das Binary wird auf fremden Systemen gestartet, deshalb hier hart pruefen:
      # kein GLIBC-Symbol darf neuer als die Baseline 2.36 sein.
      - name: Artefakt pruefen
        run: |
          file target/arm-unknown-linux-gnueabihf/release/pihole-lite
          needed=$(strings -a target/arm-unknown-linux-gnueabihf/release/pihole-lite \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "hoechste benoetigte glibc: $needed"
          if [ "$(printf '%s\n' 2.36 "$needed" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::Binary verlangt glibc $needed (> 2.36) und startet auf Raspberry Pi OS nicht"
            exit 1
          fi

      # Flach paketieren, damit der Download ohne Zielbaum ankommt.
      - name: Paketieren
        run: |
          cp target/arm-unknown-linux-gnueabihf/release/pihole-lite pihole-lite-armv6
          sha256sum pihole-lite-armv6 > pihole-lite-armv6.sha256

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pihole-lite-armv6
          path: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          if-no-files-found: error
          retention-days: 30

  # Ein Tag haengt das fertige Pi-Binary dauerhaft an das Release, statt es
  # nach 30 Tagen mit dem Workflow-Artefakt verfallen zu lassen.
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: armv6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: pihole-lite-armv6

      # Die Release-Beschreibung kommt aus dem Changelog: kuratiert, abschaltbar
      # und ohne die doppelte "Full Changelog"-Zeile, die generate_release_notes
      # bei einem zweiten Lauf anhaengt.
      - name: Release-Notizen aus dem Changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt fuer $version"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          fail_on_unmatched_files: true
