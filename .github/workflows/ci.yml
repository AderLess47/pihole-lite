name: CI

on:
  push:
    branches:
      - main
      - "freebuff/**"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # Zielhost ist ein Raspberry Pi 1 (ARM1176, ARMv6, hard-float). Ein x86-Build
  # prueft weder Feature-Set noch Linker, deshalb hier ein echter Cross-Build
  # gegen arm-unknown-linux-gnueabihf mit dem Release-Profil.
  armv6:
    name: ARMv6 cross build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: arm-unknown-linux-gnueabihf

      - name: Cross-Linker
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: armv6

      # Zielabhaengige Warnungen (z. B. bedingte Kompilierung, Layout-Annahmen
      # auf 32 Bit) tauchen im x86-Lauf nicht auf.
      - name: Clippy ARMv6
        run: cargo clippy --all-targets --target arm-unknown-linux-gnueabihf -- -D warnings

      - name: Release-Build
        run: cargo build --release --target arm-unknown-linux-gnueabihf

      - name: Artefakt pruefen
        run: file target/arm-unknown-linux-gnueabihf/release/pihole-lite

      # Flach paketieren, damit der Download ohne Zielbaum ankommt.
      - name: Paketieren
        run: |
          cp target/arm-unknown-linux-gnueabihf/release/pihole-lite pihole-lite-armv6
          sha256sum pihole-lite-armv6 > pihole-lite-armv6.sha256

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pihole-lite-armv6
          path: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          if-no-files-found: error
          retention-days: 30
