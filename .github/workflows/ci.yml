name: CI

on:
  push:
    branches:
      - main
      - "freebuff/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # bench/ liegt ausserhalb des Crate-Baums: `cargo fmt`, `clippy` und `test`
  # sehen den Lastgenerator und die Messskripte nicht. Ohne diesen Job faellt ein
  # kaputtes bench/ erst auf dem Pi auf, wenn gemessen werden soll.
  bench:
    name: bench (loadgen, skripte)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Lastgenerator bauen
        run: rustc -O --edition 2021 -D warnings bench/loadgen.rs -o loadgen

      # Der Lastgenerator wird von messung.sh aufgerufen; bricht seine
      # Argument- oder Ausgabeschnittstelle, scheitert die Messung erst dort.
      - name: Lastgenerator rauchen
        run: |
          ./loadgen --help
          if ./loadgen --mode quatsch; then
            echo "::error::loadgen akzeptiert einen unbekannten Modus"
            exit 1
          fi
          ./loadgen --server 127.0.0.1:9 --seconds 1 --threads 2 --mode blocked > loadgen.txt
          cat loadgen.txt
          # Ein nacktes `grep -q` endet unter `set -e` ohne Meldung; welcher
          # erwartete Wert fehlte, waere aus dem Log nicht zu ersehen.
          for want in '^mode=blocked$' '^qps=' '^max_ms='; do
            if ! grep -q "$want" loadgen.txt; then
              echo "::error::loadgen-Ausgabe ohne $want"
              exit 1
            fi
          done

      - name: Skripte syntaktisch pruefen
        run: |
          bash -n bench/messung.sh
          bash -n bench/eintragen.sh

      # Prueft den Weg von ergebnis.md in die Doku, ohne Server und ohne Last:
      # genau der Teil, der auf dem Pi still danebengehen wuerde.
      - name: Tabelleneintrag pruefen
        run: |
          printf '%s\n' \
            '# Messergebnis' \
            '' \
            '| Lauf | Domains | RSS idle (MiB) | Peak idle (MiB) | RSS Last (MiB) | Peak Last (MiB) | QPS |' \
            '|---|---|---|---|---|---|---|' \
            '| Weiterleitung (leere Liste) | 0 | 1.2 | 1.2 | 1.4 | 1.4 | 250.0 |' \
            '| 100k Domains (Sinkhole) | 100000 | 11.0 | 11.0 | 11.0 | 11.0 | 40000.0 |' \
            '' \
            'Tier pro Lauf:' \
            '' \
            '| Lauf | Tier | QPS |' \
            '|---|---|---|' \
            '| 100k Domains (Sinkhole) | Tier 1 (Nano) | 40000.0 |' \
            > /tmp/ergebnis.md
          bash bench/eintragen.sh /tmp/ergebnis.md
          if ! grep -q '| 100k Domains (Sinkhole) | 100000 | 11.0 | 11.0 | 11.0 | 11.0 | 40000.0 |' \
              docs/messungen.md; then
            echo "::error::die Messzeile steht nach eintragen.sh nicht in docs/messungen.md"
            exit 1
          fi
          if grep -q '^| 100k Domains (Sinkhole) | Tier 1' docs/messungen.md; then
            echo "::error::die Tier-Tabelle ist in die Messwerte geraten"
            exit 1
          fi

  # Zielhost ist ein Raspberry Pi 1 (ARM1176, ARMv6, hard-float). Ein x86-Build
  # prueft weder Feature-Set noch Linker, deshalb hier ein echter Cross-Build
  # gegen arm-unknown-linux-gnueabihf mit dem Release-Profil.
  armv6:
    name: ARMv6 cross build
    runs-on: ubuntu-latest
    # Gemessen sind es 57-111 s. Die Grenze deckt den langsamsten legitimen
    # Lauf: toter erster Mirror fuer den Index (--retry 3 --max-time 180, also
    # bis 4 x 180 s plus Backoff, rund 12 min) plus Download und Build. Ein
    # Paket, das auf dem gewaehlten Mirror haengt, kostet hoechstens 4 x 120 s,
    # bevor der Ausweich-Mirror drankommt. Enger darf die Grenze nicht werden,
    # sonst trifft sie den zweiten Mirror nie.
    timeout-minutes: 20
    # Kein Container: die glibc-Baseline kommt nicht mehr vom Host, sondern vom
    # Raspbian-Sysroot, gegen das gelinkt wird. Damit bleibt der Job ein
    # gewoehnlicher Runner-Job mit bash, rustup und Cache wie im check-Job - im
    # Container brachten dash als Standard-Shell und ein abweichendes $HOME nur
    # eigene Fehlerquellen mit.
    # Kein eigenes CARGO_HOME/RUSTUP_HOME: auf dem Runner gehoert /usr/local dem
    # System, und rustup scheitert dort mit "could not create bin directory".
    env:
      CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ github.workspace }}/armv6-link.sh
      # Ohne diese Zeile kann cargo eine andere Toolchain aufloesen als die, in
      # die rust-std fuer ARM installiert wurde ("can't find crate for `std`").
      RUSTUP_TOOLCHAIN: stable
    steps:
      # Ausgabe nur bei Fehler: sonst stehen hunderte dpkg-Zeilen im Log und
      # die Ursache eines spaeteren Fehlschlags ist im Log nicht mehr zu finden.
      - name: Werkzeuge
        run: |
          if ! { sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends \
                   ca-certificates curl git build-essential file binutils gzip xz-utils \
                   gcc-arm-linux-gnueabihf; } > /tmp/apt.log 2>&1; then
            tail -n 12 /tmp/apt.log | while IFS= read -r line; do
              echo "::error::apt: $line"
            done
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      # Die Debian-armhf-Toolchain hat ARMv7 + VFPv3 als Baseline; ihre crt-Objekte
      # tragen genau das ins Binary. Der Pi 1 ist ein ARM1176: ARMv6, VFPv2, kein
      # Thumb-2. Deshalb wird gegen einen Raspberry-Pi-OS-Sysroot gelinkt, dessen
      # crt-Objekte, libgcc und glibc fuer ARMv6 gebaut sind - sonst behauptet das
      # Binary ARMv7, und wer spaeter readelf -A liest, kann sich auf die Angabe
      # nicht verlassen.
      #
      # Der Sysroot aendert sich nicht von selbst; ohne Cache laedt jeder Lauf
      # rund 24 MB von einem Raspbian-Mirror.
      - name: ARMv6-Sysroot cachen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/armv6-sysroot
          key: armv6-sysroot-raspbian-bookworm-v1

      - name: ARMv6-Sysroot
        run: |
          set -euo pipefail
          sysroot="$RUNNER_TEMP/armv6-sysroot"
          if [ -f "$sysroot/usr/lib/arm-linux-gnueabihf/Scrt1.o" ]; then
            echo "Sysroot aus dem Cache"
          else
            mkdir -p "$sysroot"
            echo "Index holen"
            # archive.raspbian.org ist der kanonische Host; der Name
            # raspbian.raspberrypi.com ist nur ein Redirector, der je nach Laune
            # auf einen schnellen oder einen kaputten Mirror zeigt.
            mirror=""
            for candidate in http://archive.raspbian.org/raspbian \
                             http://mirror.nl.leaseweb.net/raspbian/raspbian; do
              if curl -fsSL --retry 3 --max-time 180 \
                  -o /tmp/Packages.xz "$candidate/dists/bookworm/main/binary-armhf/Packages.xz"; then
                mirror=$candidate
                break
              fi
            done
            if [ -z "$mirror" ]; then
              echo "::error::Kein Raspbian-Mirror liefert den Index"
              exit 1
            fi
            echo "Mirror: $mirror"
            xz -dc /tmp/Packages.xz > /tmp/Packages
            echo "Index: $(wc -l < /tmp/Packages) Zeilen"
            # Der Mirror, der den Index geliefert hat, zuerst; der andere bleibt
            # als Ausweichweg, falls genau dort ein Paket haengt.
            ordered=$(printf '%s\n' "$mirror" \
                       http://archive.raspbian.org/raspbian \
                       http://mirror.nl.leaseweb.net/raspbian/raspbian \
                     | awk '!seen[$0]++')
            for pkg in libc6 libc6-dev libgcc-s1 libgcc-12-dev gcc-12; do
              # sed statt grep -m1: unter `pipefail` laesst ein frueh beendetes
              # grep die Pipe mit SIGPIPE sterben und der Job bricht ohne Meldung ab.
              file=$(sed -n "/^Package: $pkg\$/,/^\$/s/^Filename: //p" /tmp/Packages)
              echo "$pkg -> ${file:-FEHLT im Index}"
              if [ -z "$file" ]; then
                echo "::error::Paket $pkg fehlt im Raspbian-Index"
                exit 1
              fi
              got=""
              for candidate in $ordered; do
                if curl -fsSL --retry 3 --max-time 120 -o "/tmp/$pkg.deb" "$candidate/$file"; then
                  got=$candidate
                  break
                fi
              done
              if [ -z "$got" ]; then
                echo "::error::Paket $pkg liess sich von keinem Mirror laden"
                exit 1
              fi
              if [ "$got" != "$mirror" ]; then
                # Ab jetzt zuerst dort nachsehen: ein Mirror, der ein Paket hat
                # haengen lassen, soll nicht bei jedem weiteren 8 min kosten.
                echo "$pkg kam von $got statt von $mirror"
                mirror=$got
                ordered=$(printf '%s\n' "$got" $ordered | awk '!seen[$0]++')
              fi
              dpkg-deb -x "/tmp/$pkg.deb" "$sysroot"
            done
          fi
          # Nicht SYSROOT nennen: der Name ist belegt. Steht SYSROOT vor der
          # Toolchain-Installation in der Umgebung, findet rustc spaeter fuer das
          # eigene Crate kein `std` mehr (E0463), obwohl rust-std installiert ist.
          echo "ARM_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          # Nichts am Binary zu reparieren, was schon hier falsch ist.
          readelf -A "$sysroot/usr/lib/arm-linux-gnueabihf/Scrt1.o" > /tmp/crt.attrs
          if ! grep -q 'Tag_CPU_arch: v6' /tmp/crt.attrs; then
            echo "::error::Sysroot-crt ist nicht ARMv6"
            cat /tmp/crt.attrs
            exit 1
          fi

      # gcc loest -lgcc und -lgcc_s in der Reihenfolge der Argumente auf. Ein -L
      # aus RUSTFLAGS landet am Ende der Linkerzeile und ist damit zu spaet:
      # libgcc kaeme weiter von der Debian-Toolchain und traegt deren v7-Attribute
      # ins Binary. Der Wrapper setzt die Sysroot-Flags vor rustcs Argumente.
      - name: Linker-Wrapper
        run: |
          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo ': "${ARM_SYSROOT:?ARM_SYSROOT fehlt}"'
            echo 'gccdir=$(ls -d "$ARM_SYSROOT"/usr/lib/gcc/arm-linux-gnueabihf/*/ 2>/dev/null | head -n 1)'
            echo 'exec arm-linux-gnueabihf-gcc --sysroot="$ARM_SYSROOT" -B"$ARM_SYSROOT"/usr/lib/arm-linux-gnueabihf -L"$gccdir" "$@"'
          } > "$GITHUB_WORKSPACE/armv6-link.sh"
          chmod +x "$GITHUB_WORKSPACE/armv6-link.sh"
          for f in Scrt1.o libc.so libgcc.a libgcc_s.so crti.o; do
            echo "wrapper: $f -> $("$GITHUB_WORKSPACE/armv6-link.sh" -print-file-name=$f)"
          done

      # Dieselbe Action wie im check-Job: sie legt rust-std fuer das ARM-Ziel
      # gleich mit an. Der handgeschriebene Installer lief zwar durch, aber
      # cargo fand danach kein `std` fuer arm-unknown-linux-gnueabihf.
      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: arm-unknown-linux-gnueabihf
      # Kein rust-cache in diesem Job: er sichert und restauriert auch RUSTUP_HOME.
      # Eine Wiederherstellung ohne rust-std fuer ARM laesst rustups Metadaten
      # trotzdem "installiert" sagen, `rustup target add` wird dann zum No-op -
      # und clippy bricht mit "can't find crate for `std`" ab. Der Build dauert
      # hier ohnehin nur eine knappe Minute.
      - name: ARM-Ziel sicherstellen
        run: |
          if ! rustup target add arm-unknown-linux-gnueabihf > /tmp/target.log 2>&1; then
            tail -n 12 /tmp/target.log | while IFS= read -r line; do
              echo "::error::target: $line"
            done
            exit 1
          fi
          rustup target list --installed

      # Zielabhaengige Warnungen (z. B. bedingte Kompilierung, Layout-Annahmen
      # auf 32 Bit) tauchen im x86-Lauf nicht auf.
      # Cargo schreibt sein Protokoll in eine Datei: die Logansicht zeigt nur den
      # Anfang, und bei einem Fehlschlag mitten im Build steht die Ursache im
      # letzten Dutzend Zeilen. Diese Zeilen gehen zusaetzlich als Annotation raus,
      # die auch dann lesbar bleibt.
      - name: Clippy ARMv6
        run: |
          if ! cargo clippy --all-targets --target arm-unknown-linux-gnueabihf -- -D warnings \
              > /tmp/clippy.log 2>&1; then
            tail -n 12 /tmp/clippy.log | while IFS= read -r line; do
              echo "::error::clippy: $line"
            done
            exit 1
          fi
          echo "Clippy ARMv6 sauber"

      - name: Release-Build
        env:
          # target-cpu statt nur target-feature: der ARM1176 ist kein generisches
          # ARMv6, sondern ein ARMv6K ohne Hardware-Division und ohne Thumb-2.
          # Sysroot, crt und libgcc kommen vom Linker-Wrapper.
          CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS: "-C target-cpu=arm1176jzf-s"
        run: |
          if ! cargo build --release --target arm-unknown-linux-gnueabihf \
              > /tmp/build.log 2>&1; then
            tail -n 12 /tmp/build.log | while IFS= read -r line; do
              echo "::error::build: $line"
            done
            exit 1
          fi
          echo "Release-Build fertig"

      # Der Lastgenerator laeuft auf dem Pi selbst, nicht auf dem Messrechner.
      # Auf x86 gebaut zeigen sich 32-Bit-Eigenheiten (Groessentypen, Linker)
      # sonst erst dort, mitten in der Messung.
      - name: Lastgenerator ARMv6 bauen
        run: |
          rustc -O --edition 2021 --target arm-unknown-linux-gnueabihf \
            -C linker="$GITHUB_WORKSPACE/armv6-link.sh" \
            -C target-cpu=arm1176jzf-s \
            -D warnings bench/loadgen.rs -o loadgen-armv6 2>&1 | tail -n 40
          file loadgen-armv6
          # Auch hier reisst die Pipe unter `bash -eo pipefail` ohne Meldung ab,
          # wenn das Binary nicht als ARM erkannt wird.
          if ! file loadgen-armv6 | grep -q 'ARM'; then
            echo "::error::loadgen-armv6 fehlt oder ist kein ARM-Binary"
            exit 1
          fi

      # Das Binary wird auf fremden Systemen gestartet, deshalb hier hart pruefen:
      # kein GLIBC-Symbol darf neuer als die Baseline 2.36 sein.
      - name: Artefakt pruefen
        run: |
          bin=target/arm-unknown-linux-gnueabihf/release/pihole-lite
          if [ ! -f "$bin" ]; then
            echo "::error::Binary fehlt: $bin - der Release-Build hat nichts hinterlassen"
            exit 1
          fi
          file $bin
          # Der Pi 1 kann ARMv6 und VFPv2. Steht hier wieder v7, ist der Sysroot
          # verrutscht und das Binary behauptet eine CPU, die es nicht gibt.
          # Ohne `|| true` wuerde ein scheiterndes readelf den Schritt unter
          # `set -e` verlassen, und zwar ohne eine Zeile im Log.
          attrs=$(readelf -A $bin || true)
          if [ -z "$attrs" ]; then
            echo "::error::readelf lieferte keine ELF-Attribute fuer $bin - Pruefung nicht moeglich"
            exit 1
          fi
          for want in 'Tag_CPU_arch: v6' 'Tag_FP_arch: VFPv2'; do
            if ! grep -q "$want" <<< "$attrs"; then
              echo "::error::ELF-Attribut fehlt: $want"
              echo "$attrs"
              exit 1
            fi
          done
          # Ohne Treffer endet die Pipe mit Status 1 und reisst unter `bash -eo
          # pipefail` den Schritt ohne eine Zeile im Log mit; deshalb der
          # explizite Fall, statt sich auf einen stillen Abbruch zu verlassen.
          needed=$(strings -a $bin \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1 || true)
          if [ -z "$needed" ]; then
            echo "::error::kein GLIBC-Symbol in $bin gefunden - glibc-Baseline nicht pruefbar"
            file $bin
            exit 1
          fi
          echo "hoechste benoetigte glibc: $needed"
          if [ "$(printf '%s\n' 2.36 "$needed" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::Binary verlangt glibc $needed (> 2.36) und startet auf Raspberry Pi OS nicht"
            exit 1
          fi

      # Flach paketieren, damit der Download ohne Zielbaum ankommt.
      - name: Paketieren
        run: |
          cp target/arm-unknown-linux-gnueabihf/release/pihole-lite pihole-lite-armv6
          sha256sum pihole-lite-armv6 > pihole-lite-armv6.sha256

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pihole-lite-armv6
          path: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          if-no-files-found: error
          retention-days: 30

  # Ein Tag haengt das fertige Pi-Binary dauerhaft an das Release, statt es
  # nach 30 Tagen mit dem Workflow-Artefakt verfallen zu lassen.
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: armv6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: pihole-lite-armv6

      # Die Release-Beschreibung kommt aus dem Changelog: kuratiert, abschaltbar
      # und ohne die doppelte "Full Changelog"-Zeile, die generate_release_notes
      # bei einem zweiten Lauf anhaengt.
      - name: Release-Notizen aus dem Changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt fuer $version"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            pihole-lite-armv6
            pihole-lite-armv6.sha256
          fail_on_unmatched_files: true

  # Sichert die im README zugesagte Eigenständigkeit technisch ab: kein
  # VPN-/HubGuard-/Abo-/Billing-Begriff im getrackten Code und keine
  # Abhängigkeit auf eine fremde Git-/Pfad-Quelle.
  independence:
    name: Eigenständigkeit (Code und Cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Kopplungs-Check
        run: python3 scripts/check_independence.py
